version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      # monthly on the 13th at a random time (load distribution)
      interval: cron
      cronjob: "37 3 13 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - muffin142
    versioning-strategy: increase
    cooldown:
      # only propose versions that have been published for at least 7 days (supply chain protection)
      default-days: 7
    ignore:
      # @types/node major must match the minimum supported Node.js version (engines.node)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript major must be supported by typescript-eslint (peer of @iobroker/eslint-config)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      # monthly on the 13th at a random time (load distribution)
      interval: cron
      cronjob: "52 4 13 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 15
    assignees:
      - muffin142
