version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      day: "thursday"
      time: "00:05"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    assignees:
      - muffin142
    versioning-strategy: increase
    cooldown:
      # only propose versions that have been published for at least 7 days (supply chain protection)
      default-days: 7
    ignore:
      # @types/node major must match the minimum supported Node.js version (engines.node)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript major must be supported by typescript-eslint (peer of @iobroker/eslint-config)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: "thursday"
      time: "00:05"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    assignees:
      - muffin142
